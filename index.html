<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>頒獎典禮播放系統</title>
  <link rel="stylesheet" href="style.css?v=20260919-clay-1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;600;800&family=Noto+Serif+TC:wght@500;600&family=Outfit:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 設定管理後台 / 輸入介面 -->
  <main id="app" class="setup-container">
    <header class="header">
      <div class="badge">Award Presentation System</div>
      <h1>🏆 頒獎典禮名單設定</h1>
      <p class="subtitle">設定各得獎組別與獲獎隊伍名稱，支援全螢幕展示，每頁點擊開始揭曉，再點擊切換下一組</p>
    </header>

    <section class="appearance-settings" aria-label="舞台外觀與配樂">
      <div class="theme-settings">
        <label for="theme-select">舞台皮膚</label>
        <select id="theme-select" aria-describedby="theme-status"></select>
        <span id="theme-status" role="status" aria-live="polite">載入皮膚中…</span>
      </div>

      <div class="music-settings">
        <label for="music-volume">配樂音量</label>
        <div class="music-controls" role="group" aria-label="配樂控制">
          <button id="music-toggle" class="btn btn-outline" type="button" aria-label="靜音配樂" aria-pressed="false" title="靜音配樂">🔊</button>
          <input id="music-volume" type="range" min="0" max="100" step="1" value="35" aria-label="配樂音量" aria-valuetext="35%">
        </div>
        <div id="music-status" class="music-status" role="status" aria-live="polite"></div>
      </div>
    </section>

    <section class="display-settings" aria-label="播放螢幕設定">
      <label for="display-select">播放螢幕</label>
      <div class="display-controls" role="group" aria-label="播放螢幕控制">
        <select id="display-select" aria-describedby="display-status" disabled>
          <option value="current">目前所在螢幕</option>
        </select>
        <button id="detect-displays-btn" class="btn btn-outline" type="button">偵測螢幕</button>
      </div>
      <span id="display-status" class="display-status" role="status" aria-live="polite"></span>
      <span class="display-help">初次偵測時，瀏覽器會詢問多螢幕管理權限。</span>
    </section>
    <section class="card form-card">
      <div class="card-header">
        <div class="card-title-row">
          <h2>名單清單</h2>
          <button id="toggle-award-list-btn" class="btn btn-ghost btn-compact" type="button" aria-expanded="true" aria-controls="award-list">隱藏隊伍名稱</button>
        </div>
        <div class="actions">
          <button id="add-item-btn" class="btn btn-secondary">
            <span class="icon">➕</span> 新增得獎項目
          </button>
          <button id="load-sample-btn" class="btn btn-outline">載入範例資料</button>
          <button id="clear-all-btn" class="btn btn-ghost text-danger">清空</button>
        </div>
      </div>

      <div id="award-list-content">
        <div id="award-list" class="award-list">
          <!-- 動態產生的輸入卡片會放在這裡 -->
        </div>

        <div class="form-footer">
          <div class="status-info">
            目前共有 <span id="award-count" class="highlight">0</span> 個得獎項目
          </div>
        </div>
      </div>
    </section>

    <div class="presentation-launch">
      <button id="start-btn" class="btn btn-primary btn-large">
        <span class="icon">▶</span> 開始全螢幕播放
      </button>
    </div>
  </main>

  <audio id="award-music" src="assets/audio/triomphe-eclatant.mp3" preload="metadata" loop></audio>

  <!-- 手動換頁舞台；composition 只負責頒獎視覺。 -->
  <div id="stage" class="stage-overlay hidden" tabindex="-1" aria-label="得獎展示舞台">
    <div id="theme-root" class="stage-viewport"></div>
  </div>

  <script src="themes/catalog.js?v=20260919-clay-1"></script>
  <script src="theme-manager.js?v=20260919-clay-1"></script>
  <script src="music-controller.js?v=20260919-clay-1"></script>
  <script src="app.js?v=20260919-clay-1"></script>
</body>
</html>
