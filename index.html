<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>頒獎典禮播放系統</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 設定管理後台 / 輸入介面 -->
  <main id="app" class="setup-container">
    <header class="header">
      <div class="badge">Award Presentation System</div>
      <h1>🏆 頒獎典禮名單設定</h1>
      <p class="subtitle">設定各得獎組別與獲獎隊伍名稱，支援全螢幕展示，點擊畫面即可切換下一組</p>
    </header>

    <section class="theme-settings" aria-label="舞台外觀">
      <label for="theme-select">舞台皮膚</label>
      <select id="theme-select" aria-describedby="theme-status"></select>
      <span id="theme-status" role="status" aria-live="polite">載入皮膚中…</span>
    </section>

    <section class="card form-card">
      <div class="card-header">
        <h2>名單清單</h2>
        <div class="actions">
          <button id="add-item-btn" class="btn btn-secondary">
            <span class="icon">➕</span> 新增得獎項目
          </button>
          <button id="load-sample-btn" class="btn btn-outline">載入範例資料</button>
          <button id="clear-all-btn" class="btn btn-ghost text-danger">清空</button>
        </div>
      </div>

      <div id="award-list" class="award-list">
        <!-- 動態產生的輸入卡片會放在這裡 -->
      </div>

      <div class="form-footer">
        <div class="status-info">
          目前共有 <span id="award-count" class="highlight">0</span> 個得獎項目
        </div>
        <button id="start-btn" class="btn btn-primary btn-large">
          <span class="icon">▶</span> 開始全螢幕播放
        </button>
      </div>
    </section>
  </main>

  <!-- 手動換頁舞台；composition 只負責頒獎視覺。 -->
  <div id="stage" class="stage-overlay hidden" aria-label="得獎展示舞台">
    <div id="theme-root" class="stage-viewport"></div>
    <!-- 點擊舞台或按空白鍵前進，方向鍵切換，Esc 結束播放。 -->
    <div class="stage-controls">
      <div class="stage-progress" title="點擊畫面或按空白鍵：下一組；左右鍵：切換；Esc：結束播放">
        <span id="current-index-label">1</span> / <span id="total-count-label">1</span>
        <span class="stage-click-hint">點擊畫面 · 下一組</span>
      </div>
      <div class="control-buttons" aria-label="播放控制">
        <button id="prev-btn" class="ctrl-btn" title="上一個 (← 鍵)">⏮</button>
        <button id="next-btn" class="ctrl-btn" title="下一個 (→ 鍵)">⏭</button>
        <button id="exit-fullscreen-btn" class="ctrl-btn exit" title="結束播放 (Esc 鍵)">✕</button>
      </div>
    </div>
  </div>

  <script src="themes/catalog.js"></script>
  <script src="theme-manager.js"></script>
  <script src="app.js"></script>
</body>
</html>
