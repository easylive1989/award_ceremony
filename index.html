<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>頒獎典禮播放系統</title>
  <link rel="stylesheet" href="style.css?v=20260923-claude-stars-2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;600;800&family=Noto+Serif+TC:wght@500;600&family=Outfit:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 設定管理後台 / 輸入介面 -->
  <main id="app" class="setup-container">
    <header class="header">
      <div class="badge" data-i18n="badge">頒獎典禮播放系統</div>
      <h1 data-i18n="heading">頒獎典禮名單設定</h1>
      <p class="subtitle" data-i18n="subtitle">設定得獎組別與獲獎隊伍，點擊一次揭曉，再點擊切換下一組。</p>
    </header>

    <section class="display-settings" aria-label="播放螢幕設定" data-i18n-aria-label="displayRegion">
      <div class="display-main">
        <div class="display-row">
          <label for="display-select" data-i18n="displayLabel">播放螢幕</label>
          <div class="display-controls" role="group" aria-label="播放螢幕控制" data-i18n-aria-label="displayControls">
            <select id="display-select" aria-describedby="display-status" disabled>
              <option value="current" data-i18n="currentDisplay">目前所在螢幕</option>
            </select>
            <button id="detect-displays-btn" class="btn btn-outline" type="button" data-i18n="detectDisplays">偵測螢幕</button>
          </div>
          <span id="display-status" class="display-status" role="status" aria-live="polite"></span>
        </div>
        <span class="display-help" data-i18n="displayHelp">初次偵測時，瀏覽器會詢問多螢幕管理權限。</span>
      </div>

      <div class="music-settings">
        <label for="music-volume" data-i18n="musicLabel">配樂音量</label>
        <div class="music-controls" role="group" aria-label="配樂控制" data-i18n-aria-label="musicControls">
          <button id="music-toggle" class="btn btn-outline music-toggle" type="button" aria-label="靜音配樂" aria-pressed="false" title="靜音配樂"><img class="guide-icon" src="assets/icons/music.png" alt="" aria-hidden="true"></button>
          <input id="music-volume" type="range" min="0" max="100" step="1" value="35" aria-label="配樂音量" data-i18n-aria-label="musicLabel" aria-valuetext="35%">
        </div>
        <div id="music-status" class="music-status" role="status" aria-live="polite"></div>
      </div>
    </section>
    <section class="card form-card">
      <div class="card-header">
        <div class="card-title-row">
          <h2 data-i18n="listTitle">名單清單</h2>
          <button id="toggle-award-list-btn" class="btn btn-ghost btn-compact" type="button" aria-expanded="true" aria-controls="award-list">隱藏隊伍名稱</button>
        </div>
        <div class="actions">
          <button id="add-item-btn" class="btn btn-secondary">
            <img class="guide-icon" src="assets/icons/add-item.png" alt="" aria-hidden="true"><span data-i18n="addAward">新增得獎項目</span>
          </button>
          <button id="load-sample-btn" class="btn btn-outline" data-i18n="loadSample">載入範例資料</button>
          <button id="clear-all-btn" class="btn btn-ghost text-danger" data-i18n="clearAll">清空</button>
        </div>
      </div>

      <div id="award-list-content">
        <div id="award-list" class="award-list">
          <!-- 動態產生的輸入卡片會放在這裡 -->
        </div>

        <div class="form-footer">
          <div class="status-info">
            <span data-i18n="awardCountPrefix">目前共有</span> <span id="award-count" class="highlight">0</span> <span data-i18n="awardCountSuffix">個得獎項目</span>
          </div>
        </div>
      </div>
    </section>

  </main>

  <audio id="award-music" src="assets/audio/triomphe-eclatant.mp3" preload="metadata" loop></audio>

  <!-- 手動換頁舞台；composition 只負責頒獎視覺。 -->
  <div id="stage" class="stage-overlay hidden" tabindex="-1" aria-label="得獎展示舞台" data-i18n-aria-label="stageLabel">
    <div id="theme-root" class="stage-viewport"></div>
  </div>

  <script src="themes/catalog.js?v=20260923-claude-stars-2"></script>
  <script src="theme-manager.js?v=20260923-claude-stars-2"></script>
  <script src="music-controller.js?v=20260923-claude-stars-2"></script>
  <script src="app.js?v=20260923-claude-stars-2"></script>
</body>
</html>
